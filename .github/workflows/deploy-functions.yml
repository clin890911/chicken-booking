name: Deploy Cloud Functions

# 後端（Cloud Functions）自動部署。
#
# 為什麼需要這支：前端由 Zeabur 接 GitHub 自動 build，後端一直是手動 firebase deploy。
# 兩邊不同步就會出現「前端更新了、後端 RBAC 還是舊的 → 操作一直被 403 擋」這類難查的問題
# （#95 訂位專員帶位跳雲端同步失敗即是一例）。
#
# 觸發：main 上動到 functions/** 或 firebase.json 時自動跑；也可在 Actions 頁手動觸發。
# 只部署 functions，不碰 Firestore 規則（規則變更風險不同，維持手動）。
#
# ── 部署帳戶需要的設定（2026-08 首次實際上線時逐一踩出來的，別再重試一遍）──
#
# secret：FIREBASE_SERVICE_ACCOUNT = 服務帳戶 JSON 金鑰全文
#         （Settings → Secrets and variables → Actions）
#
# 該服務帳戶需要這 9 個角色。本專案是 Gen 2 函式（firebase-functions/v2），實體是 Cloud Run、
# 要先經 Cloud Build 打包、映像檔進 Artifact Registry、暫存放 Cloud Storage，
# 且程式碼用 defineSecret 宣告了 Telegram/LINE 三把金鑰要從 Secret Manager 綁定：
#   roles/firebase.admin              CLI 讀專案設定
#   roles/cloudfunctions.admin        建立/更新函式
#   roles/run.admin                   Gen2 函式本體是 Cloud Run 服務
#   roles/cloudbuild.builds.editor    Gen2 部署要 build 容器
#   roles/artifactregistry.admin      映像檔存放
#   roles/iam.serviceAccountUser      以執行期服務帳戶身分部署
#   roles/secretmanager.admin         綁定 defineSecret 宣告的金鑰
#   roles/storage.admin               Cloud Build 暫存 bucket
#   roles/cloudscheduler.admin        ★ 排程函式（onSchedule）用。cloudfunctions.admin
#                                       **不包含**它，少了這個會出現「Failed to upsert
#                                       schedule function X」——HTTP 函式全部成功、只有
#                                       dailyBackup / notificationHeartbeat /
#                                       retryNotifications 三支失敗。
#
# 另需由專案擁有者手動啟用一次（部署帳戶刻意不給 serviceusage.serviceUsageAdmin，
# 否則它能開啟專案裡任何 Google 服務，權限過大）：
#   cloudbilling.googleapis.com  — CLI 會查帳單狀態確認專案在 Blaze 方案
#   https://console.cloud.google.com/apis/library/cloudbilling.googleapis.com

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

# 同時只跑一個部署，避免兩次 push 交錯把舊版蓋回去。
concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: chicken-booking-tw

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22' # 對齊 functions/package.json engines
          cache: npm

      # 部署前先跑根目錄單元測試：functions/lib 的純邏輯（RBAC 權限矩陣、資料投影、
      # 通知 diff）都在這裡測。測不過就不該上線。
      - name: Install root deps
        run: npm ci
      - name: Unit tests
        run: npm test

      # firebase deploy 會實際載入 functions 程式碼來探索匯出的函式，所以本地要有 node_modules。
      - name: Install functions deps
        run: npm ci
        working-directory: functions

      - name: Syntax check
        run: npm run lint
        working-directory: functions

      - name: Check deploy credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::缺少 repo secret FIREBASE_SERVICE_ACCOUNT（Firebase 服務帳戶 JSON 金鑰全文）。"
            echo "::error::設定路徑：Settings → Secrets and variables → Actions → New repository secret。"
            exit 1
          fi

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"

      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        # 釘大版號：小版更新照吃，避免哪天 firebase-tools 出大版把部署弄壞。
        run: npx --yes firebase-tools@^15 deploy --only functions --project "$FIREBASE_PROJECT" --non-interactive --force

      # 金鑰檔在 runner 上是臨時檔，但明確刪掉，即使後續步驟失敗也不留在磁碟。
      - name: Remove service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
